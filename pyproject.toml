[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winwhispr"
version = "0.1.0"
description = "Offline Windows dictation prototype with hotkey-driven text injection and analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "comtypes>=1.4.0",
    "faster-whisper>=1.0.0",
    "huggingface_hub>=0.24.0",
    "keyboard>=0.13.5",
    "keyring>=25.0",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "openvino>=2024.3.0",
    "openvino-genai>=2024.3.0",
    "pyperclip>=1.9.0",
    "PySide6>=6.6.0",
    "sounddevice>=0.4.7",
    "transformers>=4.44.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8",
]
# NVIDIA GPU support. CTranslate2 needs cuBLAS and cuDNN 9 at runtime; NVIDIA
# ships both as wheels, so no CUDA toolkit install is required. Installed on
# demand for machines that have an NVIDIA GPU — see core/asr/cuda_runtime.py,
# which puts these on the Windows DLL search path.
cuda = [
    "nvidia-cublas-cu12>=12.3",
    "nvidia-cudnn-cu12>=9.0",
]

[project.scripts]
winwhispr = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "database*", "desktop*"]