<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinWhispr</title>
<style>
  /* The pill.
   *
   * Same language as the app window -- one hard outline, one offset shadow --
   * but dark, because it floats over whatever you are working in and a paper
   * lozenge would read as a stray dialog. The shadow is what separates it from
   * the desktop underneath without a drop-shadow blur, which WebView2 would
   * clip at the window edge anyway.
   */
  @font-face {
    font-family: "Space Grotesk";
    src: url("/static/vendor/space-grotesk.woff2") format("woff2");
    font-weight: 400 700;
    font-display: swap;
  }
  @font-face {
    font-family: "Inter";
    src: url("/static/vendor/inter.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --ink: #1a1a1a;
    --panel: #1e293b;
    --panel-2: #273548;
    --paper: #f5f0e8;
    --yellow: #ffcc00;
    --green: #22c55e;
    --red: #e63b2e;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    /* The window is painted this colour too: WebView2 has no transparent
       backdrop on Windows, so anything showing through would be white. */
    background: var(--ink);
    color: var(--paper);
    font-family: "Inter", system-ui, "Segoe UI", sans-serif;
    font-size: 12.5px;
    user-select: none; cursor: default;
  }

  #root { height: 100%; }
  .pill {
    position: absolute; inset: 0 4px 4px 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px;
    background: var(--panel);
    border: 2px solid var(--paper);
    box-shadow: 4px 4px 0 var(--yellow);
  }
  body.state-error .pill { box-shadow: 4px 4px 0 var(--red); }
  body.state-live .pill { box-shadow: 4px 4px 0 var(--green); }

  .dot { width: 9px; height: 9px; flex: none; border: 1px solid var(--paper); background: #64748b; }
  .dot.live { background: var(--green); animation: blink 1.2s steps(2, end) infinite; }
  .dot.busy { background: var(--yellow); }
  .dot.error { background: var(--red); }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }

  .lines { min-width: 0; flex: 1; }
  .state {
    font-family: "Space Grotesk", sans-serif;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .detail {
    color: var(--muted); font-size: 11.5px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Idle is a lozenge the width of a word: the second line would not fit and
     has nothing to say. */
  body.size-idle .detail { display: none; }

  /* Before the microphone is granted the whole pill is the button: there is no
     room in it for a button beside anything else. */
  .overlay {
    position: absolute; inset: 0 4px 4px 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--yellow); color: var(--ink);
    border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--paper);
  }
  .overlay[hidden] { display: none; }

  button {
    border: 2px solid var(--ink);
    background: var(--paper); color: var(--ink);
    font-family: "Space Grotesk", sans-serif;
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    cursor: pointer; padding: 9px 12px;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 120ms cubic-bezier(.2,.8,.3,1), box-shadow 120ms cubic-bezier(.2,.8,.3,1);
  }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  .overlay.arm {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: transparent; box-shadow: none;
  }
  .overlay.arm:active { transform: none; }
  .overlay.menu { flex-direction: column; padding: 10px; background: var(--paper); }
  .overlay.menu button { width: 100%; }
  .overlay .quit { background: var(--red); color: #fff; }
</style>
</head>
<body class="size-arm">
<div id="root"></div>
<!-- Vendored, and UMD, so they must load before the module that wraps them. -->
<script src="/static/vendor/react.js"></script>
<script src="/static/vendor/react-dom.js"></script>
<script src="/static/vendor/htm.js"></script>
<script type="module" src="/static/pill.js"></script>
</body>
</html>
