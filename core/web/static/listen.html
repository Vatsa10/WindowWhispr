<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinWhispr</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    /* Opaque, and the same colour the window is painted: WebView2 has no
       transparent backdrop on Windows, so a rounded corner over a transparent
       window shows a white triangle instead of the desktop. */
    background: #12151f;
    color: #e6e9f2; font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; cursor: default;
  }
  .pill {
    height: 100%; padding: 0 12px;
    display: flex; align-items: center; gap: 9px;
    border: 1px solid #2a3145;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5266; flex: none; }
  .dot.live { background: #4ade80; animation: pulse 1.1s ease-in-out infinite; }
  .dot.busy { background: #fbbf24; }
  .dot.error { background: #f87171; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }

  .lines { min-width: 0; flex: 1; }
  .state {
    font-weight: 600; font-size: 12px; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .detail {
    color: #8c96ad; font-size: 12px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Idle is a lozenge the size of a word: the second line would not fit and
     has nothing to say. */
  body.size-idle .detail { display: none; }
  body.size-idle .state { font-size: 12px; }

  /* Before the microphone is granted the whole pill is the button: there is
     no room in it for a button beside anything else. */
  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #12151f;
  }
  .overlay[hidden] { display: none; }
  button {
    border: 0; border-radius: 8px; background: #4f7cff; color: #fff;
    font: inherit; font-weight: 600; font-size: 13px; cursor: pointer;
    padding: 9px 14px;
  }
  #arm { position: absolute; inset: 0; width: 100%; border-radius: 0; }
  #menu { flex-direction: column; padding: 10px; }
  #menu button { width: 100%; }
  #quit { background: #7f1d1d; }
  #dismiss { background: #232a3c; }
</style>
</head>
<body class="size-arm">
<div class="pill">
  <span class="dot" id="dot"></span>
  <div class="lines">
    <div class="state" id="state">Starting…</div>
    <div class="detail" id="detail" role="status" aria-live="polite"></div>
  </div>
</div>

<div class="overlay" id="menu" hidden>
  <button id="quit" type="button">Quit WinWhispr</button>
  <button id="dismiss" type="button">Keep running</button>
</div>

<button class="overlay" id="arm" type="button">Tap to enable the microphone</button>
<script type="module" src="/static/listen.js"></script>
</body>
</html>
