<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinWhispr</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: transparent; overflow: hidden;
    display: grid; place-items: center;
    color: #e6e9f2; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; cursor: default;
  }
  .pill {
    width: 100%; height: 100%; padding: 0 16px;
    display: flex; align-items: center; gap: 11px;
    border-radius: 16px; border: 1px solid #262c3e;
    background: #12151fee; box-shadow: 0 8px 28px #0009;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4b5266; flex: none; }
  .dot.live { background: #4ade80; animation: pulse 1.1s ease-in-out infinite; }
  .dot.busy { background: #fbbf24; }
  .dot.error { background: #f87171; }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
  .lines { min-width: 0; flex: 1; }
  .state { font-weight: 600; letter-spacing: -.01em; }
  .detail {
    color: #8c96ad; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Before the microphone is granted the whole pill is the button, because
     there is no room in it for a button beside anything else. */
  .arm {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; border-radius: 16px; background: #4f7cff; color: #fff;
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .arm[hidden] { display: none; }
</style>
</head>
<body>
<div class="pill">
  <span class="dot" id="dot"></span>
  <div class="lines">
    <div class="state" id="state">Starting…</div>
    <div class="detail" id="detail" role="status" aria-live="polite"></div>
  </div>
</div>
<button class="arm" id="arm" type="button">Tap to enable the microphone</button>
<script type="module" src="/static/listen.js"></script>
</body>
</html>
