<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinWhispr</title>
<link rel="preload" href="/static/vendor/geist.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* The pill.
   *
   * It cannot be hidden -- Chromium freezes an occluded renderer and a frozen
   * renderer hears nothing -- so idle is the smallest thing that still counts
   * as visible: a dot in a corner, at a third opacity. It grows into a real
   * pill only while there is something to say, and shrinks back after.
   *
   * The window is painted the same colour as the pill because WebView2 has no
   * transparent backdrop on Windows; anything showing through would be white.
   */
  @font-face {
    font-family: "Geist";
    src: url("/static/vendor/geist.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("/static/vendor/geist-mono.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --surface: #16203a;
    --surface-2: #1e293b;
    --border: #2e3c56;
    --fg: #f8fafc;
    --fg-2: #94a3b8;
    --fg-3: #64748b;
    --live: #22c55e;
    --bad: #ef4444;
    --ease: cubic-bezier(.2, .8, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Geist", system-ui, "Segoe UI", sans-serif;
    font-size: 12.5px; line-height: 1.4;
    user-select: none; cursor: default;
  }

  /* --- the dot ---------------------------------------------------------- */

  /* Idle. Faint enough to stop noticing, solid enough that the window is not
     occluded, which is the line the recognizer depends on.

     The core fills the window rather than sitting inside it: WebView2 has no
     transparent backdrop, so any padding around the dot would show as a dark
     square on the desktop. Filling it leaves only the four corners of an 18px
     window, which read as nothing. */
  .dot-wrap {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    opacity: .62;
    transition: opacity var(--fast, 140ms) var(--ease);
  }
  .dot-wrap:hover { opacity: 1; }

  /* A status light, not a blob. At 18px there is room for exactly two things:
     a dark body with a rim, and a lit core inside it. That reads as a device
     that is switched on, where a flat grey circle reads as a rendering bug --
     which is precisely how it was being read. */
  .dot-core {
    width: 100%; height: 100%; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1.5px #ffffff33, 0 1px 3px #0009;
  }
  .dot-core::after {
    content: ""; width: 40%; height: 40%; border-radius: 50%;
    background: var(--fg-2);
    transition: background var(--fast, 140ms) var(--ease);
  }
  .dot-core.live { background: var(--live); box-shadow: inset 0 0 0 1.5px #ffffff55, 0 1px 3px #0009; }
  .dot-core.live::after { background: #06280f; }
  .dot-core.busy::after { background: var(--fg); }
  .dot-core.error { background: var(--bad); }
  .dot-core.error::after { background: #3f0b0b; }
  .dot-core.live { animation: breathe 1.3s var(--ease) infinite; }
  @keyframes breathe { 50% { opacity: .3; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .dot-core.live { animation: none; } }

  /* --- the pill --------------------------------------------------------- */

  .pill {
    position: absolute; inset: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  body.state-live .pill { border-color: #22c55e66; }
  body.state-error .pill { border-color: #ef444466; }

  .led { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3); }
  .led.live { background: var(--live); animation: breathe 1.3s var(--ease) infinite; }
  .led.busy { background: var(--fg-2); }
  .led.error { background: var(--bad); }
  @media (prefers-reduced-motion: reduce) { .led.live { animation: none; } }

  .lines { min-width: 0; flex: 1; }
  .state {
    font-size: 12.5px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .detail {
    color: var(--fg-2); font-size: 11.5px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* --- overlays --------------------------------------------------------- */

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
  }
  /* Before the microphone is granted the whole pill is the button: there is
     no room in it for a button beside anything else. */
  .overlay.arm { border: 0; background: transparent; color: var(--fg); }
  .overlay.menu { flex-direction: column; padding: 10px; }

  button {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); color: var(--fg);
    font: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; padding: 9px 12px;
    transition: background 140ms var(--ease), border-color 140ms var(--ease),
                transform 140ms var(--ease);
  }
  button:hover { background: #273449; border-color: #3d4f70; }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
  .overlay.arm button {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: 14px;
  }
  .overlay.menu button { width: 100%; }
  .overlay.menu .quit { background: #ef44441c; border-color: #7f1d1d; color: #f87171; }
</style>
</head>
<body class="size-arm state-idle">
<div id="root"></div>
<!-- Vendored, and UMD, so they must load before the module that wraps them. -->
<script src="/static/vendor/react.js"></script>
<script src="/static/vendor/react-dom.js"></script>
<script src="/static/vendor/htm.js"></script>
<script type="module" src="/static/pill.js"></script>
</body>
</html>
