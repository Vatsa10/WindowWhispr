<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c12">
<title>WinWhispr</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg hidden aria-hidden="true">
  <symbol id="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="2" width="6" height="12" rx="3"></rect>
    <path d="M5 11a7 7 0 0 0 14 0"></path>
    <line x1="12" y1="18" x2="12" y2="22"></line>
    <line x1="8" y1="22" x2="16" y2="22"></line>
  </symbol>
  <symbol id="icon-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
  </symbol>
  <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="12" height="12" rx="2"></rect>
    <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
  </symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16"></path>
    <path d="M9 7V4h6v3"></path>
    <path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"></path>
    <line x1="10" y1="11" x2="10" y2="17"></line>
    <line x1="14" y1="11" x2="14" y2="17"></line>
  </symbol>
  <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="22" y1="2" x2="11" y2="13"></line>
    <path d="M22 2 15 22l-4-9-9-4 20-7Z"></path>
  </symbol>
</svg>

<div class="page">
  <header class="app-header">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>WinWhispr</h1>
        <p class="engine" id="engine">checking...</p>
      </div>
    </div>
  </header>

  <main>
    <button id="talk" class="talk" type="button" aria-pressed="false" aria-describedby="status">
      <svg class="talk-icon" width="28" height="28" aria-hidden="true"><use href="#icon-mic"></use></svg>
      <canvas id="waveform" class="waveform" width="220" height="44" aria-hidden="true"></canvas>
      <span class="talk-label" id="talk-label">Tap to talk</span>
    </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <fieldset class="toggles">
      <legend class="sr-only">Session options</legend>
      <label class="toggle" for="continuous">
        <input type="checkbox" id="continuous" checked>
        <span>Keep listening</span>
      </label>
      <label class="toggle" id="autosend-wrap" for="autosend" hidden>
        <input type="checkbox" id="autosend">
        <span>Type on PC</span>
      </label>
    </fieldset>

    <label class="field" for="text">
      <span class="field-label">Transcript</span>
      <textarea id="text" rows="9" placeholder="Your words appear here. Speak, pause, and they arrive."></textarea>
    </label>
  </main>

  <footer class="actions">
    <button id="send" class="primary" type="button" hidden>
      <svg width="18" height="18" aria-hidden="true"><use href="#icon-send"></use></svg>
      <span>Send to PC</span>
    </button>
    <button id="copy" class="ghost" type="button">
      <svg width="18" height="18" aria-hidden="true"><use href="#icon-copy"></use></svg>
      <span>Copy</span>
    </button>
    <button id="clear" class="ghost" type="button">
      <svg width="18" height="18" aria-hidden="true"><use href="#icon-trash"></use></svg>
      <span>Clear</span>
    </button>
  </footer>
</div>
<script type="module" src="/static/ui.js"></script>
</body>
</html>
